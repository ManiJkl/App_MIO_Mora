<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIO Cali - Tracker de Rutas Preferidas</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-gray-100 h-full font-sans antialiased flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-gray-800/80 backdrop-blur-md border-b border-gray-700/60 sticky top-0 z-30 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-bus text-xl"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg sm:text-xl tracking-tight bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
                        MIO Tracker Cali
                    </h1>
                    <p class="text-[11px] text-gray-400 font-medium">Panel Personalizado de Rutas</p>
                </div>
            </div>

            <!-- Header Status Badges & Controls -->
            <div class="flex items-center gap-2">
                <div id="statusBadge" class="px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 bg-blue-900/40 text-blue-300 border border-blue-700/50">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                    <span id="statusText" class="hidden sm:inline">Conectando...</span>
                </div>

                <button onclick="fetchActiveRoutesData()" title="Refrescar Ubicaciones" class="p-2.5 rounded-xl bg-gray-700/60 hover:bg-gray-600 text-gray-200 transition-colors border border-gray-600/50">
                    <i id="refreshIcon" class="fa-solid fa-arrows-rotate text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 flex flex-col lg:flex-row gap-4 overflow-hidden relative">
        
        <!-- Sidebar Controls & Favorite Routes -->
        <aside class="w-full lg:w-96 flex flex-col gap-4 flex-shrink-0 z-20">
            
            <!-- Quick Route Selector -->
            <div class="bg-gray-800/90 backdrop-blur-xl rounded-2xl p-4 shadow-xl border border-gray-700/60 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-star text-amber-400"></i>
                        Mis Rutas Preferidas
                    </h2>
                    <span id="selectedCount" class="text-[11px] bg-blue-900/60 text-blue-300 px-2.5 py-0.5 rounded-full font-bold border border-blue-700/40">
                        0 activas
                    </span>
                </div>

                <!-- Grid of Custom Cards (T12, P40B, A11, A14A) -->
                <div id="routesGrid" class="grid grid-cols-2 gap-2.5 pt-1">
                    <!-- Cards dynamically rendered in app.js -->
                </div>
            </div>

            <!-- Active Fleet List / Buses in Service -->
            <div class="bg-gray-800/90 backdrop-blur-xl rounded-2xl p-4 shadow-xl border border-gray-700/60 flex-1 flex flex-col min-h-[220px] lg:min-h-0 overflow-hidden">
                <div class="flex items-center justify-between border-b border-gray-700/60 pb-2.5 mb-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-radar text-blue-400"></i>
                        Buses en Circulación
                    </h3>
                    <span id="totalBusesCount" class="text-xs text-gray-400 font-semibold">0 buses</span>
                </div>

                <div id="busesListContainer" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                    <!-- Bus status cards rendered in app.js -->
                </div>
            </div>

        </aside>

        <!-- Interactive Map Display -->
        <section class="flex-1 flex flex-col bg-gray-800/90 backdrop-blur-xl rounded-2xl shadow-xl border border-gray-700/60 overflow-hidden relative min-h-[350px] lg:min-h-0">
            
            <!-- Floating Map Controls -->
            <div class="absolute top-3 left-3 right-3 z-[1000] flex justify-between items-center pointer-events-none">
                <div class="pointer-events-auto bg-gray-900/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-gray-700/80 shadow-lg text-xs font-semibold text-gray-300 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    <span>API: <code class="text-blue-400 font-mono">mio-backend-mora</code></span>
                </div>

                <button onclick="recenterMap()" title="Centrar mapa en Cali" class="pointer-events-auto bg-gray-900/90 backdrop-blur-md px-3.5 py-1.5 rounded-xl border border-gray-700/80 shadow-lg text-xs font-bold text-gray-200 hover:bg-gray-800 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-crosshairs text-blue-400"></i>
                    <span>Centrar</span>
                </button>
            </div>

            <!-- Leaflet Canvas -->
            <div id="map" class="w-full h-full z-10 min-h-[350px]"></div>

            <!-- Map Bottom Legend -->
            <div class="bg-gray-900/90 border-t border-gray-700/60 px-4 py-2.5 flex items-center justify-between text-[11px] text-gray-400 z-20">
                <div class="flex items-center gap-3">
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> T12</span>
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> P40B</span>
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> A11</span>
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span> A14A</span>
                </div>
                <div id="lastUpdated" class="italic text-gray-500">Esperando sincronización...</div>
            </div>

        </section>

    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0q肢+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""></script>
    <!-- Main Application JavaScript -->
    <script src="app.js"></script>
</body>
</html>
