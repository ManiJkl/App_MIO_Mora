<!DOCTYPE html>
<html lang="es" data-theme="blue" data-appearance="auto" data-mode="dark" data-glass="on">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MIO Tracker</title>
    <meta name="description" content="Ubicación en tiempo real de los buses del MIO en Cali.">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
        (function () {
            var root = document.documentElement;
            try {
                var appearance = localStorage.getItem('mio-tracker-appearance') || 'auto';
                var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
                root.dataset.theme = localStorage.getItem('mio-tracker-theme') || 'blue';
                root.dataset.appearance = appearance;
                root.dataset.mode = appearance === 'auto' ? (prefersLight ? 'light' : 'dark') : appearance;
                root.dataset.glass = localStorage.getItem('mio-tracker-glass') === 'false' ? 'off' : 'on';
            } catch (error) {
                // Storage unavailable: keep defaults from the <html> attributes
            }
        })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ME2E5HNNJK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-ME2E5HNNJK');
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="app-header">
        <div class="brand">
            <img src="icon.png" alt="" class="brand-logo" width="40" height="40">
            <div class="brand-text">
                <h1 class="brand-title">MIO Tracker</h1>
                <p class="brand-subtitle">Buses del MIO en tiempo real</p>
            </div>
        </div>

        <!-- Header Status Badge & Controls -->
        <div class="header-actions">
            <div id="statusBadge" class="status-badge" data-state="loading" role="status" aria-live="polite">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText" class="status-text">Conectando...</span>
            </div>

            <button type="button" onclick="fetchActiveRoutesData()" title="Refrescar ubicaciones" aria-label="Refrescar ubicaciones" class="icon-button">
                <i id="refreshIcon" class="fa-solid fa-arrows-rotate"></i>
            </button>

            <div class="settings-menu">
                <button id="settingsButton" type="button" class="icon-button" aria-expanded="false" aria-controls="settingsPanel" title="Configuración" aria-label="Configuración">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <div id="settingsPanel" class="settings-panel" hidden>
                    <div class="settings-heading">
                        <strong>Configuración</strong>
                        <button id="closeSettingsButton" type="button" class="settings-close" aria-label="Cerrar configuración">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <fieldset class="settings-field">
                        <legend class="settings-label">Color de interfaz</legend>
                        <div id="themeOptions" class="theme-options">
                            <button type="button" class="theme-option" data-theme-option="blue"><span class="theme-swatch swatch-blue"></span>Azul</button>
                            <button type="button" class="theme-option" data-theme-option="amber"><span class="theme-swatch swatch-amber"></span>Ámbar</button>
                            <button type="button" class="theme-option" data-theme-option="teal"><span class="theme-swatch swatch-teal"></span>Turquesa</button>
                            <button type="button" class="theme-option" data-theme-option="violet"><span class="theme-swatch swatch-violet"></span>Violeta</button>
                            <button type="button" class="theme-option" data-theme-option="rose"><span class="theme-swatch swatch-rose"></span>Rosa</button>
                            <button type="button" class="theme-option" data-theme-option="lime"><span class="theme-swatch swatch-lime"></span>Lima</button>
                            <button type="button" class="theme-option" data-theme-option="indigo"><span class="theme-swatch swatch-indigo"></span>Índigo</button>
                            <button type="button" class="theme-option" data-theme-option="red"><span class="theme-swatch swatch-red"></span>Rojo</button>
                            <button type="button" class="theme-option" data-theme-option="yellow"><span class="theme-swatch swatch-yellow"></span>Amarillo</button>
                            <button type="button" class="theme-option" data-theme-option="green"><span class="theme-swatch swatch-green"></span>Verde</button>
                            <button type="button" class="theme-option" data-theme-option="white"><span class="theme-swatch swatch-white"></span>Blanco</button>
                            <button type="button" class="theme-option" data-theme-option="black"><span class="theme-swatch swatch-black"></span>Negro</button>
                        </div>
                    </fieldset>
                    <label class="settings-field">
                        <span class="settings-label">Apariencia</span>
                        <select id="appearanceSelect" class="select">
                            <option value="dark">Oscuro</option>
                            <option value="light">Claro</option>
                            <option value="auto">Automático</option>
                        </select>
                    </label>
                    <label class="settings-field settings-toggle">
                        <span class="settings-label">Efecto liquid glass</span>
                        <input id="glassToggle" type="checkbox" checked>
                    </label>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout: full-bleed map with a floating dock -->
    <main class="app-main">

        <!-- Interactive Map -->
        <section class="map-shell" aria-label="Mapa de buses">

            <!-- Floating Map Controls -->
            <div class="map-toolbar">
                <div class="map-actions">
                    <label class="map-select" title="Cambiar modo del mapa">
                        <i class="fa-solid fa-layer-group text-accent" aria-hidden="true"></i>
                        <span class="sr-only">Modo del mapa</span>
                        <select id="mapMode" onchange="changeMapMode(this.value)">
                            <!-- <option value="dark">Oscuro</option> NO SIRVE -->
                            <option value="satellite" selected>Satélite</option>
                            <option value="street">Calles</option>
                            <option value="terrain">Terreno</option>
                        </select>
                    </label>
                    <button type="button" onclick="recenterMap()" title="Centrar mapa en Cali" aria-label="Centrar mapa en Cali" class="map-button">
                        <i class="fa-solid fa-crosshairs text-accent"></i>
                        <span class="btn-label">Centrar</span>
                    </button>
                    <button id="trafficToggleButton" type="button" onclick="toggleTraffic()" title="Configurar tráfico TomTom" aria-label="Tráfico" class="map-button">
                        <i id="trafficToggleIcon" class="fa-solid fa-traffic-light text-warning"></i>
                        <span id="trafficToggleText" class="btn-label">Tráfico</span>
                    </button>
                    <button id="locateMeButton" type="button" onclick="locateUser()" title="Activar seguimiento de ubicación" aria-label="Seguir mi ubicación" class="map-button map-button-accent">
                        <i id="locateMeIcon" class="fa-solid fa-location-crosshairs"></i>
                        <span class="btn-label">Seguimiento</span>
                    </button>
                </div>
            </div>

            <!-- Leaflet Canvas -->
            <div id="map" class="map-canvas"></div>
        </section>

        <!-- Dock: nearest stop + route selector (side panel on desktop, bottom sheet on mobile) -->
        <aside id="dock" class="dock" data-sheet="peek" data-tab="nearest" aria-label="Paradas y rutas">
            <button id="dockHandle" type="button" class="dock-handle" aria-expanded="false" aria-controls="dock" aria-label="Expandir panel">
                <span class="dock-handle-bar"></span>
            </button>

            <div class="dock-tabs" role="tablist" aria-label="Secciones">
                <button id="tabNearest" type="button" class="dock-tab is-active" role="tab" aria-selected="true" aria-controls="nearestPanel" data-dock-tab="nearest">
                    <i class="fa-solid fa-location-dot" aria-hidden="true"></i>Cerca de mí
                </button>
                <button id="tabRoutes" type="button" class="dock-tab" role="tab" aria-selected="false" aria-controls="rutas_seleccionar" data-dock-tab="routes">
                    <i class="fa-solid fa-route" aria-hidden="true"></i>Rutas
                    <span id="selectedCount" class="count-pill">0 activas</span>
                </button>
            </div>

            <!-- Nearest Stop Information -->
            <section id="nearestPanel" class="dock-panel nearest-panel" role="tabpanel" aria-labelledby="tabNearest">
                <div id="nearestStopContainer" class="nearest-body scroll-area">
                    <div class="empty-state">
                        <span class="empty-state-icon"><i class="fa-solid fa-location-crosshairs"></i></span>
                        <p class="empty-state-title">Busca la parada más cercana</p>
                        <p class="empty-state-text">Permite el acceso a tu ubicación para ver las próximas llegadas.</p>
                    </div>
                </div>
            </section>

            <!-- Route Selector -->
            <section id="rutas_seleccionar" class="dock-panel routes-panel" role="tabpanel" aria-labelledby="tabRoutes" hidden>
                <label class="route-search">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <span class="sr-only">Buscar ruta</span>
                    <input id="routeSearch" type="search" placeholder="Buscar ruta, código o tipo" autocomplete="off">
                </label>
                <div class="route-results-summary">
                    <span id="routesResultCount">0 de 0 rutas</span>
                    <span>Toca para monitorear</span>
                </div>

                <div id="routesGrid" class="routes-grid scroll-area">
                    <!-- Tarjetas generadas dinámicamente en app.js -->
                </div>
            </section>

            <!-- Legend + sync status -->
            <footer class="dock-foot">
                <div id="mapLegend" class="map-legend"></div>
                <div id="lastUpdated" class="map-updated">Esperando sincronización...</div>
            </footer>
        </aside>

    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Main Application JavaScript -->
    <script src="app.js"></script>
</body>
</html>
